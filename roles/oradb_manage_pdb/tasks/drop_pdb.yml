---
- name: Drop PDB
  oracle_pdb:
    name: "{{ item.pdb_name }}"
    sourcedb: "{{ item.cdb }}"
    datafile_dest: "{{ item.datafile_dest | default(omit) }}"
    save_state: "{{ item.save_state | default(omit) }}"
    pdb_admin_username: "{{ pdbadmin_user | default(omit) }}"
    pdb_admin_password: "{{ pdbadmin_password | default(omit) }}"
    host: "{{ hostname }}"
    username: "{{ db_user | default('sys') }}"
    password: "{{ db_password_cdb }}"
    mode: "{{ db_mode }}"
    service_name: "{{ oracle_db_name }}"
    port: "{{ listener_port }}"
    state: "{{ item.state | default(omit) }}"
  environment: "{{ oracle_env }}"
  loop: "{{ drop_oracle_pdbs | default([]) }}"
  when: drop_pdb and item.state == 'absent'

- name: Remove existing XML manifest before unplug (prevents ORA-65170)
  ansible.builtin.file:
    path: "{{ item.xml_dest }}/{{ item.xml_file }}"
    state: absent
  loop: "{{ drop_oracle_pdbs | default([]) }}"
  when: unplug_pdb and item.state == 'unplugged'

- name: Unplug PDB to XML file
  oracle_pdb:
    name: "{{ item.pdb_name }}"
    sourcedb: "{{ item.cdb }}"
    datafile_dest: "{{ item.datafile_dest | default(omit) }}"
    save_state: "{{ item.save_state | default(omit) }}"
    pdb_admin_username: "{{ pdbadmin_user | default(omit) }}"
    pdb_admin_password: "{{ pdbadmin_password | default(omit) }}"
    host: "{{ hostname }}"
    username: "{{ db_user | default('sys') }}"
    password: "{{ db_password_cdb }}"
    mode: "{{ db_mode }}"
    service_name: "{{ oracle_db_name }}"
    port: "{{ listener_port }}"
    state: "{{ item.state | default(omit) }}"
    unplug_dest: "{{ item.xml_dest }}/{{ item.xml_file }}"
  environment: "{{ oracle_env }}"
  loop: "{{ drop_oracle_pdbs | default([]) }}"
  when: unplug_pdb and item.state == 'unplugged'
