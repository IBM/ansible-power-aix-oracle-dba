---
# roles/mig_rman_l0_l1/tasks/run_restore.yml
# Execute RMAN restore on destination for L0 and L1.
# Included only inside the destination restore block — no delegate_to needed.
#
# Knowledge Article KB144840 (MOS Doc 2999157.1) steps 2.5, 3.5:
#
#   Non-CDB → Non-CDB:  rman target /
#   Non-CDB → PDB:      rman target /          (ORACLE_SID = dest_cdb_sid CDB root)
#   PDB     → PDB:      rman target sys@<pdb-connect-string>
#
# KA step 2.5c / 3.5c: "For PDB connect directly into PDB"
#   $ rman target sys@<pdb-connect-string> cmdfile=<restore_cmdfile_name>
#
# For PDB→PDB (mig_pdb=1): ORACLE_SID = dest_cdb_sid, connect via PDB service.
# For Non-CDB→Non-CDB or Non-CDB→PDB: ORACLE_SID = source_oracle_sid, rman target /
# dest_oracle_sid_effective resolves the correct ORACLE_SID in all cases.
#
# NOTE: RMAN writes its own log (log= parameter) — shell tee is not used here
#       so POSIX /bin/sh is sufficient (no PIPESTATUS needed).
#       AIX destination uses /bin/sh — no bash-specific syntax.
#
# DBMIG scp behaviour (confirmed against a live run):
#   Source path : {{ m5_workdir }}/cmd/restore_<LEVEL>_<SID>_<DT>.cmd
#   Destination : scp to ${DEST_USER}@${DEST_SERVER}:${DEST_WORKDIR}
#   Result on dest: {{ m5_workdir }}/restore_<LEVEL>_<SID>_<DT>.cmd  (workdir ROOT, not cmd/)
# We derive the dest path by taking just the filename from the source fact —
# checking the source's own path directly only works when m5_workdir happens
# to be NFS-shared.
#
# DBMIG's cmdfile ALSO issues its own internal "SPOOL LOG TO log/restore_<LEVEL>_
# <SID>_<DT>.log" partway through — which silently takes over RMAN's output
# stream from whatever `log=` path we pass on the command line (confirmed
# directly: a separately-timestamped log= file only ever captured the initial
# command echo, never the actual RESTORE result or error — and downstream,
# impdp.sh's TRANSPORT_DATAFILES discovery parses these same restore logs for
# "restoring foreign file ... to ..." lines, which only appear in DBMIG's own
# spooled file). Rather than guess where the real output lands, we derive that
# SAME deterministic path (cmdfile basename, .cmd → .log) and pass it as our
# own `log=` too — so there is exactly one log file, and it's the real one.

- name: "[mig_rman_l0_l1:restore] Create log directory on destination if absent"
  ansible.builtin.file:
    path:  "{{ m5_workdir }}/log"
    state: directory
    mode:  '0750'

- name: "[mig_rman_l0_l1:restore] Assert restore_cmdfile fact is populated by source"
  ansible.builtin.assert:
    that: "(hostvars[groups['mig_source'][0]].restore_cmdfile | default('')) | length > 0"
    fail_msg: >
      restore_cmdfile fact is not set on source host ({{ groups['mig_source'][0] }}).
      The backup phase must complete successfully before the restore can proceed.
    success_msg: "restore_cmdfile fact is set: {{ hostvars[groups['mig_source'][0]].restore_cmdfile | default('') }}"

- name: "[mig_rman_l0_l1:restore] Derive destination-side cmdfile path"
  ansible.builtin.set_fact:
    dest_restore_cmdfile: "{{ m5_workdir }}/{{ hostvars[groups['mig_source'][0]].restore_cmdfile | basename }}"

- name: "[mig_rman_l0_l1:restore] Verify restore cmdfile is accessible on destination"
  ansible.builtin.stat:
    path: "{{ dest_restore_cmdfile }}"
  register: restore_cmd_stat

- name: "[mig_rman_l0_l1:restore] Assert restore cmdfile exists on destination"
  ansible.builtin.assert:
    that: restore_cmd_stat.stat.exists
    fail_msg: >
      Restore cmdfile not found on destination: {{ dest_restore_cmdfile }}
      DBMIG scp's the cmdfile to DEST_WORKDIR root ({{ m5_workdir }}/), not cmd/ subdir.
      Check: ssh oracle@{{ dest_host_effective }} ls {{ m5_workdir }}/restore_*.cmd
    success_msg: "Restore cmdfile confirmed on destination: {{ dest_restore_cmdfile }}"

- name: "[mig_rman_l0_l1:restore] Derive DBMIG's internal spool log path (deterministic from cmdfile name)"
  ansible.builtin.set_fact:
    restore_run_log: >-
      {{ m5_workdir }}/log/{{ (dest_restore_cmdfile | basename) | regex_replace('\.cmd$', '.log') }}

- name: "[mig_rman_l0_l1:restore] Show restore topology"
  ansible.builtin.debug:
    msg: >-
      Topology: mig_pdb={{ mig_pdb }}, pdb_name='{{ pdb_name }}',
      dest_cdb_sid='{{ dest_cdb_sid }}', dest_pdb_name='{{ dest_pdb_name }}'.
      ORACLE_SID on dest: {{ dest_oracle_sid_effective }}.
      RMAN connect: {% if mig_pdb | int == 1 %}target sys@{{ dest_connect_string_effective }}{% else %}target /{% endif %}.
      Cmdfile on dest: {{ dest_restore_cmdfile }}
      Log (== DBMIG's own internal spool target): {{ restore_run_log }}

- name: "[mig_rman_l0_l1:restore] Execute RMAN {{ rman_level }} restore on destination (timeout={{ rman_timeout }}s)"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export PATH=${ORACLE_HOME}/bin:${PATH}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export NLS_DATE_FORMAT='DD-MON-YYYY HH24:MI:SS'
    cd {{ m5_workdir }}
    {% if mig_pdb | int == 1 %}
    rman target sys/{{ sys_password }}@{{ dest_connect_string_effective }} \
      cmdfile={{ dest_restore_cmdfile }} \
      log={{ restore_run_log }}
    {% else %}
    rman target / \
      cmdfile={{ dest_restore_cmdfile }} \
      log={{ restore_run_log }}
    {% endif %}
    RC=$?
    echo "RMAN restore exit code: ${RC}"
    exit ${RC}
  async:  "{{ rman_timeout | int }}"
  poll:   "{{ rman_poll | int }}"
  register: restore_result
  no_log: "{{ mig_pdb | int == 1 }}"   # suppress only for PDB→PDB (password in cmdline)

- name: "[mig_rman_l0_l1:restore] Show last 30 lines of restore log"
  ansible.builtin.command: "tail -30 {{ restore_run_log }}"
  register: restore_tail
  changed_when: false
  failed_when: false

- name: "[mig_rman_l0_l1:restore] Restore log tail"
  ansible.builtin.debug:
    msg: "{{ restore_tail.stdout_lines | default([]) }}"

- name: "[mig_rman_l0_l1:restore] Assert RMAN restore exited cleanly"
  ansible.builtin.assert:
    that: restore_result.rc == 0
    fail_msg: >
      RMAN {{ rman_level }} restore FAILED (rc={{ restore_result.rc }}).
      Review restore log: {{ restore_run_log }}
      Also check: {{ m5_workdir }}/log/rman_mig_bkp.log
    success_msg: "RMAN {{ rman_level }} restore completed successfully (rc=0)."

- name: "[mig_rman_l0_l1:restore] Store restore log path for verify task"
  ansible.builtin.set_fact:
    current_restore_log: "{{ restore_run_log }}"
    all_restore_logs:    "{{ (all_restore_logs | default([])) + [restore_run_log] }}"
