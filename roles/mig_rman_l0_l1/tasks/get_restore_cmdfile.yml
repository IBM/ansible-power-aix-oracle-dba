---
# roles/mig_rman_l0_l1/tasks/get_restore_cmdfile.yml
# Locate the RMAN restore cmdfile generated by dbmig_driver_m5.sh and store
# it as a host fact so run_restore.yml can access it via hostvars[source].
# Included only inside the source backup block — no delegate_to needed.
#
# DBMIG naming convention (from KA step 2.4 / 3.4):
#   cmd/restore_L0_<ORACLE_SID>_<timestamp>.cmd
#   cmd/restore_L1_<ORACLE_SID>_<timestamp>.cmd
# When multiple cmdfiles exist (repeated L1 runs), the latest by mtime is used.

- name: "[mig_rman_l0_l1:backup] Find restore cmdfile for {{ rman_level }}"
  ansible.builtin.find:
    paths:    "{{ m5_workdir }}/cmd"
    patterns: "restore_{{ rman_level }}_{{ source_oracle_sid }}_*.cmd"
  register: restore_cmdfiles

- name: "[mig_rman_l0_l1:backup] Assert restore cmdfile was generated"
  ansible.builtin.assert:
    that: restore_cmdfiles.files | length > 0
    fail_msg: >
      No restore cmdfile found after {{ rman_level }} backup.
      Expected pattern: {{ m5_workdir }}/cmd/restore_{{ rman_level }}_{{ source_oracle_sid }}_*.cmd
      Check DBMIG log: {{ m5_workdir }}/log/rman_mig_bkp.log
    success_msg: "Restore cmdfile found ({{ restore_cmdfiles.files | length }} file(s))."

- name: "[mig_rman_l0_l1:backup] Set restore_cmdfile fact (latest by mtime)"
  ansible.builtin.set_fact:
    restore_cmdfile: >-
      {{ (restore_cmdfiles.files | sort(attribute='mtime', reverse=true) | first).path }}

- name: "[mig_rman_l0_l1:backup] Display restore cmdfile path"
  ansible.builtin.debug:
    msg: "Restore cmdfile for {{ rman_level }}: {{ restore_cmdfile }}"
