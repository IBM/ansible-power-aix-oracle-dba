---
# roles/mig_rman_l0_l1/tasks/check_lockfile.yml
# Detect stale DBMIG lock file from a previous failed run.
# Included only inside the source backup block — no delegate_to needed.

- name: "[mig_rman] Check for stale DBMIG lock file"
  ansible.builtin.stat:
    path: "{{ lock_file }}"
  register: lock_stat

- name: "[mig_rman] Fail on stale lock file"
  ansible.builtin.fail:
    msg: >
      Lock file {{ lock_file }} exists — a previous DBMIG run may still be
      running or have failed. Review {{ m5_workdir }}/log/rman_mig_bkp.log
      and delete the lock file manually if safe to proceed.
  when: lock_stat.stat.exists

- name: "[mig_rman] Lock file check passed"
  ansible.builtin.debug:
    msg: "No stale DBMIG lock file found. Safe to start {{ rman_level }} backup."
