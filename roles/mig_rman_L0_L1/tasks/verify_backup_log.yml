---
# roles/mig_rman_L0_L1/tasks/verify_backup_log.yml
# Scan RMAN log for ORA- / RMAN- / WARN- messages after backup completes.
# Included only inside the source backup block — no delegate_to needed.
#
# Logic:
#   - egrep returns rc=1 when no matches found (failed_when: false absorbs that).
#   - If stdout is non-empty, display and assert no critical ORA-/RMAN- patterns.
#   - If stdout is empty, log is clean — print confirmation.
#
# IMPORTANT: scans rman_run_log (the per-run log set by run_backup.yml via
# tee), NOT the cumulative m5_workdir/log/rman_mig_bkp.log. That file is the
# KA doc's "centralized migration logfile" — it accumulates across every
# L0/L1/L1F iteration for the whole migration, so scanning it in full would
# make this assert fail forever after any single historical error, even once
# the current run completed clean.

- name: "[mig_rman_L0_L1:backup] Scan RMAN log for errors/warnings"
  ansible.builtin.shell: >
    egrep -i "WARN-|ORA-|RMAN-[0-9]{5}" {{ rman_run_log }} | head -50
  register: rman_errors
  changed_when: false
  failed_when: false

- name: "[mig_rman_L0_L1:backup] RMAN log — clean (no warnings or errors found)"
  ansible.builtin.debug:
    msg: "RMAN {{ rman_level }} backup log is clean — no ORA-/RMAN-/WARN- lines found."
  when: rman_errors.stdout | length == 0

- name: "[mig_rman_L0_L1:backup] Display RMAN warnings/errors"
  ansible.builtin.debug:
    msg: "WARNING — RMAN log entries found:\n{{ rman_errors.stdout_lines }}"
  when: rman_errors.stdout | length > 0

# Drop known-benign informational lines (e.g. ORA-28002 password-expiry
# notice) before deciding pass/fail — see rman_log_benign_patterns in
# playbooks/vars/m5_migration/mig_vars.yml for why this exists.
- name: "[mig_rman_L0_L1:backup] Filter out known-benign informational lines"
  ansible.builtin.set_fact:
    rman_critical_lines: >-
      {{ rman_errors.stdout_lines
         | reject('search', rman_log_benign_patterns | join('|'))
         | list }}
  when: rman_errors.stdout | length > 0

- name: "[mig_rman_L0_L1:backup] Assert no critical RMAN errors"
  ansible.builtin.assert:
    that:
      - "rman_critical_lines | select('search', 'ORA-') | list | length == 0"
      - "rman_critical_lines | select('search', 'RMAN-') | list | length == 0"
    fail_msg: >
      RMAN {{ rman_level }} backup log contains critical errors (ORA- or RMAN-).
      Review: {{ rman_run_log }}
      Also check the cumulative log: {{ m5_workdir }}/log/rman_mig_bkp.log
    success_msg: "RMAN {{ rman_level }} log: no critical ORA-/RMAN- errors (WARN- / known-benign only)."
  when: rman_errors.stdout | length > 0
