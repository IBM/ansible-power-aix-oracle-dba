---
hostname: "{{ hostname | default('ansible-db') }}"
listener_port: "{{ listener_port | default(1521) }}"
db_user: sys
db_mode: sysdba
db_password_cdb: "{{ default_dbpass }}"

oracle_env:
  ORACLE_HOME: "{{ oracle_db_home | default('') }}"
  LD_LIBRARY_PATH: "{{ oracle_db_home | default('') }}"
  PATH: "{{ oracle_db_home | default('') }}/bin:$PATH:/usr/local/bin:/bin:/sbin:/usr/bin:/usr/sbin"
