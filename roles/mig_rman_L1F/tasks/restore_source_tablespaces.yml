---
# roles/mig_rman_L1F/tasks/restore_source_tablespaces.yml
# Restore source tablespaces to READ WRITE after downtime completes.
# The source DB tablespaces were set READ ONLY by dbmig_driver_m5.sh L1F.
# Runs on: source host (sqlplus directly — no Instant Client needed).

- name: "[mig_rman_L1F:postchecks] Restore source tablespaces to READ WRITE"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ source_oracle_home }}
    export ORACLE_SID={{ source_oracle_sid }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      WHENEVER SQLERROR EXIT FAILURE ROLLBACK
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if mig_pdb | int == 1 and pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ pdb_name }};
      {% endif %}
      {% for ts in m5_tablespace_list_items %}
      ALTER TABLESPACE {{ ts }} READ WRITE;
      {% endfor %}
      EXIT;
    SQLEOF
  delegate_to: "{{ groups['mig_source'][0] }}"   # runs on source from destination play
  ignore_errors: true   # Source may be offline during cutover — don't hard-fail the whole cutover on this
  register: src_ts_rw_result

# Message reflects the ACTUAL result (rc), not an unconditional claim of
# success — src_ts_rw_result was previously ignored entirely here, so a
# failed or unreachable source (KA explicitly allows shutting it down after
# L1F) would still print "restored to READ WRITE" regardless of what
# actually happened.
- name: "[mig_rman_L1F:postchecks] Source tablespace READ WRITE restoration result"
  ansible.builtin.debug:
    msg: >-
      {{ 'Source tablespaces restored to READ WRITE (rc=0).'
         if src_ts_rw_result.rc | default(1) == 0
         else 'Source tablespaces NOT confirmed READ WRITE (rc='
              ~ (src_ts_rw_result.rc | default('unreachable')) ~ ') — source'
              ~ ' may be offline/shut down per KA step 4.5, which is expected'
              ~ ' and fine if intentional. If not, restore manually:'
              ~ ' ALTER TABLESPACE <ts> READ WRITE; for each of '
              ~ (m5_tablespace_list_items | join(', ')) ~ ' on ' ~ source_oracle_sid ~ '.' }}
