---
# roles/mig_rman_L1F/tasks/recompile_objects.yml
# Recompile invalid PL/SQL objects with utlrp.sql on destination.
# Runs on: destination host (sqlplus directly — no Instant Client needed).

- name: "[mig_rman_L1F:postchecks] Count invalid objects before utlrp"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_objects WHERE status = 'INVALID';
      EXIT;
    SQLEOF
  register: invalid_before
  changed_when: false

- name: "[mig_rman_L1F:postchecks] Pre-utlrp invalid count"
  ansible.builtin.debug:
    msg: "Invalid objects before recompile: {{ invalid_before.stdout | trim }}"

- name: "[mig_rman_L1F:postchecks] Run utlrp.sql on destination"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      @?/rdbms/admin/utlrp.sql
      EXIT;
    SQLEOF
  register: utlrp_result

- name: "[mig_rman_L1F:postchecks] Count invalid objects after utlrp"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_objects WHERE status = 'INVALID';
      EXIT;
    SQLEOF
  register: invalid_after
  changed_when: false

- name: "[mig_rman_L1F:postchecks] Post-utlrp invalid count"
  ansible.builtin.debug:
    msg: >
      Invalid objects after recompile: {{ invalid_after.stdout | trim }}
      (was: {{ invalid_before.stdout | trim }})
