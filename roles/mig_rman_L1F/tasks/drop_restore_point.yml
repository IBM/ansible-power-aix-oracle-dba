---
# roles/mig_rman_L1F/tasks/drop_restore_point.yml
# Drop the guaranteed restore point impdp.sh creates during the L1F import
# (KA Doc 2999157.1, Section 5 step 9: "When determined to go live, remove
# the previously created restore point.").
#
# Deliberately NOT part of the automatic mig_rman_L1F sequence (main.yml) —
# dropping a guaranteed flashback restore point is a one-way decision (loses
# the ability to flash the destination database back to its pre-import
# state) and must only happen once the migration has been verified and
# accepted as the new production database, not automatically at the end of
# an unattended cutover run.
#
# Invoke explicitly, once ready to go live:
#   ansible-playbook m5_migration.yml --tags golive_drop_restore_point --ask-vault-pass
#
# impdp.sh creates it as: create restore point before_imp_<DT> guarantee
# flashback database;  (DT computed at runtime inside the script, so the
# exact name can't be known in advance — found here by pattern instead.)
#
# UPPER(name) below is required — Oracle stores unquoted restore point names
# uppercase (e.g. BEFORE_IMP_260916072634), and LIKE is case-sensitive, so
# matching against the lowercase literal 'before_imp_%' silently returned 0
# rows even when the restore point existed (confirmed live via V$RESTORE_POINT).
#
# All tasks below are wrapped in a block tagged golive_drop_restore_point.
# This is required, not cosmetic: this file is reached via a DYNAMIC
# include_tasks (roles/mig_rman_L1F/tasks/main.yml), and Ansible does NOT
# propagate tags placed on a dynamic include statement down into the tasks
# of the included file — only tags applied at the role/play level cascade
# that deep. Without this block-level tag, running with
# --tags golive_drop_restore_point correctly triggers the include (per the
# ansible_run_tags check in main.yml) but every task in here would then be
# filtered out as untagged, silently completing with ok=1 and doing nothing.
# Confirmed live: this exact silent no-op happened before this block was added.
- name: "[mig_rman_L1F:golive] Drop guaranteed restore point"
  tags: [golive_drop_restore_point]
  block:
    - name: "[mig_rman_L1F:golive] Find guaranteed restore point(s) matching before_imp_%"
      ansible.builtin.shell: |
        export ORACLE_HOME={{ dest_oracle_home }}
        export ORACLE_SID={{ dest_oracle_sid_effective }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'SQLEOF'
          SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF LINESIZE 200
          SELECT name || '|' || scn || '|' || TO_CHAR(time,'DD-MON-YYYY HH24:MI:SS') FROM v$restore_point
          WHERE guarantee_flashback_database = 'YES' AND UPPER(name) LIKE 'BEFORE_IMP_%'
          ORDER BY scn DESC;
          EXIT;
        SQLEOF
      register: restore_points_found
      changed_when: false

    # Each row comes back as "NAME|SCN|CREATED_TIME" (pipe-delimited) so the
    # assert below can list full details (not just names) when there's more
    # than one — the .split('|') calls extract each field for display.
    - name: "[mig_rman_L1F:golive] Assert exactly one restore point found"
      ansible.builtin.assert:
        that: (restore_points_found.stdout_lines | reject('equalto', '') | list | length) == 1
        fail_msg: |-
          {% set rows = restore_points_found.stdout_lines | reject('equalto', '') | list %}
          {% if rows | length == 0 %}
          No 'before_imp_%' guaranteed restore point found on {{ dest_host_effective }} ({{ dest_oracle_sid_effective }}). Nothing to drop — check V$RESTORE_POINT manually if this is unexpected.
          {% else %}
          Found {{ rows | length }} 'before_imp_%' guaranteed restore points on {{ dest_host_effective }} ({{ dest_oracle_sid_effective }}) — expected exactly 1. Refusing to guess which one to drop:
          {% for row in rows %}{% set parts = row.split('|') %}
            {{ loop.index }}. {{ parts[0] }}  (SCN: {{ parts[1] }}, created: {{ parts[2] }})
          {% endfor %}
          Resolve manually via SQL*Plus as sys — drop the one(s) you don't need, e.g.:
            DROP RESTORE POINT <name>;
          Then re-run once only one remains:
            ansible-playbook m5_migration.yml --tags golive_drop_restore_point --ask-vault-pass
          {% endif %}
        success_msg: >-
          Found restore point:
          {{ ((restore_points_found.stdout_lines | reject('equalto', '') | list | first | default('')) | trim).split('|')[0] }}

    - name: "[mig_rman_L1F:golive] Set restore point name fact"
      ansible.builtin.set_fact:
        golive_restore_point_name: >-
          {{ ((restore_points_found.stdout_lines | reject('equalto', '') | list)[0] | trim).split('|')[0] }}

    - name: "⚠ Confirm restore point drop (irreversible — loses flashback to pre-import state)"
      ansible.builtin.pause:
        prompt: |
          ══════════════════════════════════════════════════════
          WARNING: About to DROP RESTORE POINT {{ golive_restore_point_name }}
          on {{ dest_host_effective }} ({{ dest_oracle_sid_effective }}).

          This permanently removes the ability to flash back the
          destination database to its pre-import state. Only proceed
          once the migration has been fully verified and accepted as
          the new production database (KA Doc 2999157.1, Section 5
          step 9 — "When determined to go live, remove the previously
          created restore point.")

          Press ENTER to continue or Ctrl+C A to abort.
          ══════════════════════════════════════════════════════
      run_once: true

    - name: "[mig_rman_L1F:golive] Drop guaranteed restore point {{ golive_restore_point_name }}"
      ansible.builtin.shell: |
        export ORACLE_HOME={{ dest_oracle_home }}
        export ORACLE_SID={{ dest_oracle_sid_effective }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'SQLEOF'
          SET FEEDBACK ON HEADING OFF ECHO OFF
          DROP RESTORE POINT {{ golive_restore_point_name }};
          EXIT;
        SQLEOF
      register: drop_result

    - name: "[mig_rman_L1F:golive] Verify restore point was dropped"
      ansible.builtin.shell: |
        export ORACLE_HOME={{ dest_oracle_home }}
        export ORACLE_SID={{ dest_oracle_sid_effective }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'SQLEOF'
          SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
          SELECT COUNT(*) FROM v$restore_point WHERE name = '{{ golive_restore_point_name }}';
          EXIT;
        SQLEOF
      register: drop_verify
      changed_when: false

    - name: "[mig_rman_L1F:golive] Assert restore point no longer exists"
      ansible.builtin.assert:
        that: drop_verify.stdout | trim == '0'
        fail_msg: >
          Restore point {{ golive_restore_point_name }} still exists after DROP —
          review: {{ drop_result.stdout }}
        success_msg: "Restore point {{ golive_restore_point_name }} dropped successfully. Go-live complete."
