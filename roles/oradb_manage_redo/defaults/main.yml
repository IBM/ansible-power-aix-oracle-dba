---
db_user: sys
db_mode: sysdba

listener_port_template: "{% if item.listener_port is defined %}{{ item.listener_port }}{% else %}{{ listener_port }}{% endif %}"

db_password_cdb: "{% if dbpasswords is defined and item.service_name is defined and dbpasswords[item.service_name] is defined and dbpasswords[item.service_name][db_user] is defined %}{{ dbpasswords[item.service_name][db_user] }}{% else %}{{ default_dbpass }}{% endif %}"

oracle_env:
  ORACLE_HOME: "{{ oracle_db_home | default('') }}"
  LD_LIBRARY_PATH: "{{ oracle_db_home | default('') }}"
  PATH: "{{ oracle_db_home | default('') }}/bin:$PATH:/usr/local/bin:/bin:/sbin:/usr/bin:/usr/sbin"
