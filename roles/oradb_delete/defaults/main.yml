---
# Resolve the full Oracle Home path from the current loop item.
# Prefers item.oracle_home if set; otherwise constructs from oracle_base + oracle_version_db + home.
oracle_home_db: "{% if item.oracle_home is defined %}{{ item.oracle_home }}{% else %}{{ oracle_base }}/{{ item.oracle_version_db }}/{{ item.home }}{% endif %}"
