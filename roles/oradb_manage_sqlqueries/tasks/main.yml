- name: Run SQL queries
  oracle_sql:
    user: "{{ db_user }}"
    password: "{{ db_password }}"
    service_name: "{{ service_name }}"
    hostname: "{{ hostname }}"
    port: "{{ listener_port }}"
    mode: "{{ db_mode }}"
    sql: "{{ item.query }}"
  loop: "{{ sql_query }}"
  loop_control:
    label: "{{ item.query }}"
  register: query_output

- name: SQL Output
  ansible.builtin.debug:
    msg: "{{ item.item.query }}: {{ item.msg }}"
  loop: "{{ query_output.results }}"
  loop_control:
    label: "{{ item.item.query }}"
