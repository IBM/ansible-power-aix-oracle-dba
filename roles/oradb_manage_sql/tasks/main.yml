- name: Run SQL scripts
  oracle_sql:
    user: "{{ db_user }}"
    password: "{{ db_password }}"
    service_name: "{{ service_name }}"
    hostname: "{{ hostname }}"
    port: "{{ listener_port }}"
    mode: "{{ db_mode }}"
    script: "{{ item.script }}"
  loop: "{{ sqlfile }}"
  loop_control:
    label: "{{ item.script }}"
  register: sql_output

- name: SQL Output
  ansible.builtin.debug:
    msg: "{{ sql_output.results | map(attribute='msg') | list }}"
