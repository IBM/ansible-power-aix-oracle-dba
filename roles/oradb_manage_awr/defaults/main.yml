---
db_user: sys
db_password: "{{ default_dbpass }}"
db_mode: sysdba

sql_query: >-
  select extract(day from snap_interval)*24*60 + extract(hour from snap_interval)*60 + extract(minute from snap_interval) "Snapshot Interval (min)",
  extract(day from retention) + extract(hour from retention)/24 + extract(minute from retention)/1440 "Retention (days)"
  from dba_hist_wr_control
