- name: Modify AWR settings
  oracle_awr:
    hostname: "{{ hostname }}"
    service_name: "{{ service_name }}"
    port: "{{ listener_port }}"
    user: "{{ db_user }}"
    password: "{{ db_password }}"
    mode: "{{ db_mode }}"
    snapshot_interval_min: "{{ interval }}"
    snapshot_retention_days: "{{ retention }}"

- name: Verify AWR settings in DBA_HIST_WR_CONTROL
  oracle_sql:
    user: "{{ db_user }}"
    password: "{{ db_password }}"
    service_name: "{{ service_name }}"
    hostname: "{{ hostname }}"
    port: "{{ listener_port }}"
    mode: "{{ db_mode }}"
    sql: "{{ sql_query }}"
  register: awr_verify

- name: Show AWR settings [snapshot interval (min), retention (days)]
  ansible.builtin.debug:
    msg: "{{ awr_verify.msg }}"
