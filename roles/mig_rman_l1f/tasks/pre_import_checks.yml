---
# roles/mig_rman_l1f/tasks/pre_import_checks.yml
# Assert that prerequisites are met before running impdp.sh:
#   • L0 + L1F restore logs exist
#   • DataPump dumpfile is known (from mig_rman L1F fact)
# Runs on destination host.

- name: "[mig_rman_l1f:import] Find restore log files on destination"
  ansible.builtin.find:
    paths:    "{{ m5_workdir }}/log"
    patterns: "restore_L*.log"
  register: restore_logs_found

- name: "[mig_rman_l1f:import] Assert at least L0 + L1F restore logs exist"
  ansible.builtin.assert:
    that: restore_logs_found.files | length >= 2
    fail_msg: >
      Expected at least 2 restore logs (L0 + L1F) in {{ m5_workdir }}/log/.
      Found: {{ restore_logs_found.files | length }}.
      Complete L0 and L1F restore phases before running import.
    success_msg: >-
      {{ restore_logs_found.files | length }} restore log(s) found under
      {{ m5_workdir }}/log/ — prerequisite met.

- name: "[mig_rman_l1f:import] Resolve DataPump dumpfile name from hostvars"
  ansible.builtin.set_fact:
    impdp_dumpfile: >-
      {{ hostvars[groups['mig_source'][0]]['expdp_dumpfile'] | default(expdp_dumpfile | default('')) }}

- name: "[mig_rman_l1f:import] Assert dumpfile is set"
  ansible.builtin.assert:
    that:
      - impdp_dumpfile is defined
      - impdp_dumpfile | length > 0
    fail_msg: >
      expdp_dumpfile is not set!
      Ensure the L1F (rman_l1f) backup phase has run and registered expdp_dumpfile.
    success_msg: "DataPump dumpfile resolved: {{ impdp_dumpfile }}"

- name: "[mig_rman_l1f:import] Verify impdp.sh exists on destination"
  ansible.builtin.stat:
    path: "{{ m5_workdir }}/impdp.sh"
  register: impdp_sh_stat
  failed_when: not impdp_sh_stat.stat.exists

- name: "[mig_rman_l1f:import] Pre-import checks passed"
  ansible.builtin.debug:
    msg: "impdp.sh found at {{ m5_workdir }}/impdp.sh — ready to configure and run import."
