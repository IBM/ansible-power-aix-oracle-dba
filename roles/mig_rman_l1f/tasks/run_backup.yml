---
# roles/mig_rman_l1f/tasks/run_backup.yml
# Run dbmig_driver_m5.sh L1F on the source host.
# Uses Ansible async/poll so multi-hour runs are tracked properly.
# Invocation: sh dbmig_driver_m5.sh L1F
#
# L1F interactively prompts for the SYSTEM password (KA Doc 2999157.1: "The
# script prompts for the system password... needed to put the tablespaces
# being transported into read only mode, and to perform the export"). With no
# TTY attached (this runs under Ansible async/nohup), the script's own `stty`
# call to disable echo fails and the prompt gets nothing, so SQL*Plus ends up
# invoked with an incomplete connect string and authentication fails. Piping
# the password into the script's stdin feeds the prompt non-interactively —
# the `stty: Inappropriate ioctl for device` messages this produces are
# harmless (stty failing doesn't stop the following `read` from consuming the
# piped input, it just means echo-suppression didn't happen, which is moot
# for piped/non-tty input anyway).

- name: "[mig_rman_l1f:backup] Build timestamped log path for {{ rman_level }} backup"
  ansible.builtin.set_fact:
    rman_run_log: "{{ m5_workdir }}/log/rman_{{ rman_level }}_run_{{ now(utc=true, fmt='%Y%m%d_%H%M%S') }}.out"
  delegate_to: "{{ groups['mig_source'][0] }}"

- name: "[mig_rman_l1f:backup] Create log directory if absent"
  ansible.builtin.file:
    path:  "{{ m5_workdir }}/log"
    state: directory
    mode:  '0750'
  delegate_to: "{{ groups['mig_source'][0] }}"

- name: "[mig_rman_l1f:backup] Execute dbmig_driver_m5.sh {{ rman_level }} (timeout={{ rman_timeout }}s)"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ source_oracle_home }}
    export PATH=${ORACLE_HOME}/bin:${ORACLE_HOME}/OPatch:${PATH}
    export ORACLE_SID={{ source_oracle_sid }}
    export NLS_DATE_FORMAT='DD-MON-YYYY HH24:MI:SS'
    cd {{ m5_workdir }}
    echo {{ system_password | quote }} | sh dbmig_driver_m5.sh {{ rman_level }} 2>&1 | tee {{ rman_run_log }}
    exit ${PIPESTATUS[1]}
  delegate_to: "{{ groups['mig_source'][0] }}"
  async:  "{{ rman_timeout | int }}"
  poll:   "{{ rman_poll | int }}"
  register: rman_job
  no_log: true   # system_password is embedded in cmd — never let it reach Ansible's own output/failure dump

- name: "[mig_rman_l1f:backup] Show last 30 lines of RMAN run log"
  ansible.builtin.command: "tail -30 {{ rman_run_log }}"
  delegate_to: "{{ groups['mig_source'][0] }}"
  register: rman_tail
  changed_when: false
  failed_when: false

- name: "[mig_rman_l1f:backup] RMAN run log tail"
  ansible.builtin.debug:
    msg: "{{ rman_tail.stdout_lines | default([]) }}"

- name: "[mig_rman_l1f:backup] Assert dbmig_driver_m5.sh exited cleanly"
  ansible.builtin.assert:
    that: rman_job.rc == 0
    fail_msg: >
      dbmig_driver_m5.sh {{ rman_level }} FAILED (rc={{ rman_job.rc }}).
      Full log: {{ rman_run_log }}
      Also check: {{ m5_workdir }}/log/rman_mig_bkp.log
    success_msg: "dbmig_driver_m5.sh {{ rman_level }} completed (rc=0)."
