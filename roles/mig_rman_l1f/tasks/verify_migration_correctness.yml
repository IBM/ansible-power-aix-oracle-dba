---
# roles/mig_rman_l1f/tasks/verify_migration_correctness.yml
# The real pass/fail gate for the migration: compares {{ app_schema }} table
# counts on source vs destination and HARD FAILS on mismatch. This is the
# actual correctness signal — not impdp.sh's own exit code (proven unreliable
# this session: it returns rc=0 even when the import outright failed with
# UDI-00002 or ORA-12504) and not its log content (verify_import.yml's scan
# is informational only — Full Transportable Import routinely logs non-fatal
# noise, e.g. GSMROOTUSER-related warnings, unrelated to the migrated data,
# and a genuinely new/unrecognized error is not reliably distinguishable from
# that noise by pattern alone).
#
# Runs BEFORE Stage 4 (postchecks) deliberately, as part of the import phase
# block in main.yml: destination tablespaces don't go READ WRITE and source
# isn't restored to READ WRITE until this gate passes, so downtime doesn't
# end on unverified data.
#
# Table count parity is a practical, not absolute, correctness signal — it
# confirms the same number of tables exist on both sides, not that every row
# matches. Full Transportable Tablespace import either brings a tablespace's
# objects over intact or fails on that object, so for this migration shape
# it's a reasonable proxy; validate_migration.yml's later DB-size and
# tablespace-status checks provide corroborating signals in the full report.

- name: "[mig_rman_l1f:verify] Count {{ app_schema | upper }} tables on source"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ source_oracle_home }}
    export ORACLE_SID={{ source_oracle_sid }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if mig_pdb | int == 1 and pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_tables
      WHERE owner = UPPER('{{ app_schema }}');
      EXIT;
    SQLEOF
  delegate_to: "{{ groups['mig_source'][0] }}"
  register: gate_src_table_count
  changed_when: false

- name: "[mig_rman_l1f:verify] Count {{ app_schema | upper }} tables on destination"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_tables
      WHERE owner = UPPER('{{ app_schema }}');
      EXIT;
    SQLEOF
  register: gate_dst_table_count
  changed_when: false

- name: "[mig_rman_l1f:verify] Assert source and destination table counts match"
  ansible.builtin.assert:
    that: (gate_src_table_count.stdout | trim | int) == (gate_dst_table_count.stdout | trim | int)
    fail_msg: >
      MIGRATION VERIFICATION FAILED — {{ app_schema | upper }} table count
      mismatch: source={{ gate_src_table_count.stdout | trim }},
      destination={{ gate_dst_table_count.stdout | trim }}. The import did
      NOT correctly bring over all tables. Destination will NOT be set READ
      WRITE and downtime will NOT end — review before retrying.
      impdp log warnings/errors seen this run:
      {{ impdp_errors.stdout_lines | default(['(none captured)']) }}
      Full log: {{ m5_workdir }}/log/impdp_run.out
    success_msg: >-
      Verified: {{ app_schema | upper }} table counts match on source and
      destination ({{ gate_dst_table_count.stdout | trim }} tables).
      Proceeding to end downtime.
