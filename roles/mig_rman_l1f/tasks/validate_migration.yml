---
# roles/mig_rman_l1f/tasks/validate_migration.yml
# Comprehensive migration validation — runs in the destination play.
# Source tasks use delegate_to for cross-host queries.
# Table counts, tablespace status, invalid objects, DB sizes — all via sqlplus.

- name: "[mig_rman_l1f:validate] Ensure reports directory exists on controller"
  ansible.builtin.file:
    path:  "{{ validation_report_dir }}"
    state: directory
    mode:  '0755'
  delegate_to: localhost

# ── Table counts ──────────────────────────────────────────────────────────────
- name: "[mig_rman_l1f:validate] Count {{ app_schema | upper }} tables on source"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ source_oracle_home }}
    export ORACLE_SID={{ source_oracle_sid }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if mig_pdb | int == 1 and pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_tables
      WHERE owner = UPPER('{{ app_schema }}');
      EXIT;
    SQLEOF
  delegate_to: "{{ groups['mig_source'][0] }}"
  register: src_table_count
  changed_when: false

- name: "[mig_rman_l1f:validate] Count {{ app_schema | upper }} tables on destination"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_tables
      WHERE owner = UPPER('{{ app_schema }}');
      EXIT;
    SQLEOF
  register: dst_table_count
  changed_when: false

- name: "[mig_rman_l1f:validate] Compare table counts"
  ansible.builtin.debug:
    msg: >
      {{ app_schema | upper }} tables —
      Source: {{ src_table_count.stdout | trim }}
      Dest  : {{ dst_table_count.stdout | trim }}

# ── Tablespace status on destination ─────────────────────────────────────────
- name: "[mig_rman_l1f:validate] Check tablespace status on destination"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 100 FEEDBACK ON HEADING ON ECHO OFF LINESIZE 80
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT tablespace_name, status FROM dba_tablespaces
      WHERE tablespace_name IN
      ({{ m5_tablespace_list_items | map('regex_replace', '^(.*)$', "'\1'") | join(',') }})
      ORDER BY 1;
      EXIT;
    SQLEOF
  register: ts_status
  changed_when: false

- name: "[mig_rman_l1f:validate] Tablespace status"
  ansible.builtin.debug:
    msg: "{{ ts_status.stdout }}"

# ── Invalid objects ───────────────────────────────────────────────────────────
- name: "[mig_rman_l1f:validate] Count invalid objects on destination"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT COUNT(*) FROM dba_objects
      WHERE status = 'INVALID' AND owner != 'SYS';
      EXIT;
    SQLEOF
  register: invalid_objects
  changed_when: false

- name: "[mig_rman_l1f:validate] Invalid object count"
  ansible.builtin.debug:
    msg: "Invalid objects (non-SYS) on destination: {{ invalid_objects.stdout | trim }}"

# ── DB size comparison ────────────────────────────────────────────────────────
- name: "[mig_rman_l1f:validate] Get allocated size on source (GB)"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ source_oracle_home }}
    export ORACLE_SID={{ source_oracle_sid }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if mig_pdb | int == 1 and pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ pdb_name }};
      {% endif %}
      SELECT ROUND(SUM(bytes)/1024/1024/1024,2) FROM dba_data_files;
      EXIT;
    SQLEOF
  delegate_to: "{{ groups['mig_source'][0] }}"
  register: src_size_gb
  changed_when: false

- name: "[mig_rman_l1f:validate] Get allocated size on destination (GB)"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    export PATH=$ORACLE_HOME/bin:$PATH
    sqlplus -s / as sysdba <<'SQLEOF'
      SET PAGESIZE 0 FEEDBACK OFF HEADING OFF ECHO OFF
      {% if dest_pdb_name | default('') | length > 0 %}
      ALTER SESSION SET CONTAINER = {{ dest_pdb_name }};
      {% endif %}
      SELECT ROUND(SUM(bytes)/1024/1024/1024,2) FROM dba_data_files;
      EXIT;
    SQLEOF
  register: dst_size_gb
  changed_when: false

# ── Write validation report ───────────────────────────────────────────────────
- name: "[mig_rman_l1f:validate] Write migration validation report"
  ansible.builtin.copy:
    content: |
      ══════════════════════════════════════════════════════════════════════
      Oracle M5 Migration — Validation Report
      Generated : {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
      ══════════════════════════════════════════════════════════════════════
      SOURCE  : {{ hostvars[groups['mig_source'][0]].ansible_host }} ({{ source_oracle_home }})
      DEST    : {{ dest_host_effective }}   ({{ dest_oracle_home }})
      SID     : {{ source_oracle_sid }}
      ──────────────────────────────────────────────────────────────────────
      TABLE COUNTS ({{ app_schema | upper }} schema)
        Source  : {{ src_table_count.stdout | trim }}
        Dest    : {{ dst_table_count.stdout | trim }}
      ──────────────────────────────────────────────────────────────────────
      DB SIZE (allocated datafiles)
        Source  : {{ src_size_gb.stdout | trim }} GB
        Dest    : {{ dst_size_gb.stdout | trim }} GB
      ──────────────────────────────────────────────────────────────────────
      INVALID OBJECTS (non-SYS)
        Count   : {{ invalid_objects.stdout | trim }}
      ──────────────────────────────────────────────────────────────────────
      GUARANTEED RESTORE POINT (created by impdp.sh)
        Name    : {{ l1f_restore_point_name | default('(none captured — see impdp_run.out)') }}
        ACTION  : Drop once go-live is confirmed (KA Doc 2999157.1 Section 5
                  step 9) — otherwise flashback logs are retained indefinitely.
                  ansible-playbook m5_migration.yml --tags golive_drop_restore_point --ask-vault-pass
      ──────────────────────────────────────────────────────────────────────
      TABLESPACE STATUS
      {{ ts_status.stdout }}
      ══════════════════════════════════════════════════════════════════════
      MIGRATION VALIDATION COMPLETE
      ══════════════════════════════════════════════════════════════════════
    dest: "{{ validation_report_dir }}/migration_validation_report.txt"
    mode: '0644'
  delegate_to: localhost

- name: "[mig_rman_l1f:validate] Validation report path"
  ansible.builtin.debug:
    msg: "Report: {{ validation_report_dir }}/migration_validation_report.txt"
