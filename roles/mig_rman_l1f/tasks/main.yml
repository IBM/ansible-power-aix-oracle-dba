---
# roles/mig_rman_l1f/tasks/main.yml
# ════════════════════════════════════════════════════════════════════════════════
# Combined cutover role — runs as a single unit during the DOWNTIME WINDOW.
#
# Sequence:
#   1. L1F backup on source       (sets transport TSs READ ONLY → DOWNTIME STARTS)
#   2. L1F restore on destination
#   3. DataPump Full Transportable Import on destination
#   4. Set migrated TSs READ WRITE on destination  (DOWNTIME ENDS)
#   5. Restore source TSs to READ WRITE
#   6. Recompile invalid objects (utlrp.sql) on destination
#   7. Gather schema stats on destination
#   8. Validate migration + write report (delegated src/dest from destination play)
#
# Each play in m5_migration.yml targets one host group:
#   Play 1 → hosts: mig_source       (backup phase)
#   Play 2 → hosts: mig_destination  (restore + import + postchecks)
#
# Tasks that need to run on the OTHER host use delegate_to internally.
# Tag: --tags rman_l1f
# ════════════════════════════════════════════════════════════════════════════════

- name: "[mig_rman_l1f] Set rman_timeout for L1F"
  ansible.builtin.set_fact:
    rman_timeout: "{{ rman_timeout_l1f }}"

# ════════════════════════════════════════════════════════════════════════════════
# STEP 1: L1F RMAN Backup (source play only)
# ════════════════════════════════════════════════════════════════════════════════
- name: "▶ STAGE 1/4 START — L1F Backup [SOURCE-ONLY — skips on destination host] — sets transport TSs READ ONLY, DOWNTIME STARTS"
  when: inventory_hostname in groups['mig_source']
  ansible.builtin.debug:
    msg: "Starting L1F backup on {{ inventory_hostname }} — this sets the transport tablespaces READ ONLY on source."

- name: "[mig_rman_l1f:backup] L1F backup phase [SOURCE-ONLY — this whole block, and every task inside it, only ever runs on the source host]"
  when: inventory_hostname in groups['mig_source']
  block:
    - name: "[mig_rman_l1f:backup] Include check_lockfile.yml (source-only)"
      ansible.builtin.include_tasks: check_lockfile.yml
    - name: "[mig_rman_l1f:backup] Include run_backup.yml (source-only)"
      ansible.builtin.include_tasks: run_backup.yml
    - name: "[mig_rman_l1f:backup] Include verify_backup_log.yml (source-only)"
      ansible.builtin.include_tasks: verify_backup_log.yml
    - name: "[mig_rman_l1f:backup] Include get_restore_cmdfile.yml (source-only)"
      ansible.builtin.include_tasks: get_restore_cmdfile.yml
    - name: "[mig_rman_l1f:backup] Include sync_backup_pieces.yml (source-only)"
      ansible.builtin.include_tasks: sync_backup_pieces.yml
    - name: "[mig_rman_l1f:backup] Include capture_expdp_file.yml (source-only)"
      ansible.builtin.include_tasks: capture_expdp_file.yml

- name: "✓ STAGE 1/4 COMPLETE — L1F backup, RMAN piece sync, and dump file capture all succeeded [SOURCE-ONLY]"
  when: inventory_hostname in groups['mig_source']
  ansible.builtin.debug:
    msg: >-
      Backup phase done: dbmig_driver_m5.sh L1F succeeded, backup pieces and
      the DataPump dumpfile ({{ expdp_dumpfile | default('?') }}) are on the
      destination. Proceeding to Stage 2 (restore) in the destination play.

# ════════════════════════════════════════════════════════════════════════════════
# STEP 2: L1F RMAN Restore (destination play only)
# ════════════════════════════════════════════════════════════════════════════════
- name: "▶ STAGE 2/4 START — L1F Restore [DESTINATION-ONLY — skips on source host]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: "Starting L1F restore on {{ inventory_hostname }} — restoring foreign datafiles from the synced backup pieces."

- name: "[mig_rman_l1f:restore] L1F restore phase [DESTINATION-ONLY — this whole block, and every task inside it, only ever runs on the destination host]"
  when: inventory_hostname in groups['mig_destination']
  block:
    - name: "[mig_rman_l1f:restore] Include run_restore.yml (destination-only)"
      ansible.builtin.include_tasks: run_restore.yml
    - name: "[mig_rman_l1f:restore] Include verify_restore_log.yml (destination-only)"
      ansible.builtin.include_tasks: verify_restore_log.yml

- name: "✓ STAGE 2/4 COMPLETE — RMAN restore succeeded, restore log clean [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: "Restore phase done: foreign datafiles restored to {{ current_restore_log | default('?') }}. Proceeding to Stage 3 (import)."

# ════════════════════════════════════════════════════════════════════════════════
# STEP 3: DataPump Full Transportable Import (destination play only)
# ════════════════════════════════════════════════════════════════════════════════
- name: "▶ STAGE 3/4 START — DataPump Full Transportable Import [DESTINATION-ONLY — skips on source host]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: "Starting DataPump full transportable import on {{ inventory_hostname }} — run mode: {{ impdp_run_mode }}."

- name: "[mig_rman_l1f:import] DataPump import phase [DESTINATION-ONLY — this whole block, and every task inside it, only ever runs on the destination host]"
  when: inventory_hostname in groups['mig_destination']
  block:
    - name: "[mig_rman_l1f:import] Include pre_import_checks.yml (destination-only)"
      ansible.builtin.include_tasks: pre_import_checks.yml
    - name: "[mig_rman_l1f:import] Include run_impdp.yml (destination-only)"
      ansible.builtin.include_tasks: run_impdp.yml
    - name: "[mig_rman_l1f:import] Include verify_import.yml (destination-only) — informational impdp log scan, NOT the pass/fail gate"
      ansible.builtin.include_tasks: verify_import.yml
    - name: "[mig_rman_l1f:verify] Include verify_migration_correctness.yml (destination-only) — REAL pass/fail gate: source vs destination table counts, before downtime ends"
      ansible.builtin.include_tasks: verify_migration_correctness.yml

- name: "✓ STAGE 3/4 COMPLETE — impdp.sh ran, table counts verified matching source, destination DB confirmed OPEN [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: "Import phase done: source/destination table counts verified matching, destination DB is OPEN. Proceeding to Stage 4 (postchecks) — downtime ends next."

# ════════════════════════════════════════════════════════════════════════════════
# STEP 4–8: Post-migration DBA tasks + validation (destination play only)
# Each sub-task uses delegate_to internally where source is needed.
# ════════════════════════════════════════════════════════════════════════════════
- name: "▶ STAGE 4/4 START — Postchecks (read-write cutback, recompile, stats, validate) [DESTINATION-ONLY — skips on source host]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: "Starting postchecks on {{ inventory_hostname }} — destination TSs go READ WRITE next (DOWNTIME ENDS here)."

- name: "[mig_rman_l1f:postchecks] Set dest TSs READ WRITE (DOWNTIME ENDS) [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.include_tasks: set_tablespaces_readwrite.yml

- name: "[mig_rman_l1f:postchecks] Restore source TSs to READ WRITE [DESTINATION-ONLY task, but its SQL targets source via delegate_to]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.include_tasks: restore_source_tablespaces.yml

- name: "[mig_rman_l1f:postchecks] Recompile invalid objects (utlrp.sql) [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.include_tasks: recompile_objects.yml

- name: "[mig_rman_l1f:postchecks] Gather schema stats [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.include_tasks: gather_stats.yml

- name: "[mig_rman_l1f:postchecks] Validate migration + write report [DESTINATION-ONLY task, queries both hosts via delegate_to]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.include_tasks: validate_migration.yml

- name: "✓ STAGE 4/4 COMPLETE — destination READ WRITE, recompiled, stats gathered, report written [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: "Postchecks done. DOWNTIME ENDED. Validation report: {{ validation_report_dir }}/migration_validation_report.txt"

# NOTE: main.yml is shared between BOTH plays in m5_migration.yml — Play 1
# (hosts: mig_source, backup phase only) and Play 2 (hosts: mig_destination, restore
# + import + postchecks). Without the "when" guard below, this task used to
# fire unconditionally in EVERY play the role runs in, including Play 1 —
# printing "CUTOVER COMPLETE" on the SOURCE host right after the backup
# phase finished, before Play 2 (where restore/import/postchecks actually
# happen) had even started. run_once alone doesn't scope it to the right
# play; it only picks one host WITHIN whichever play is currently running.
# Confirmed live: this message appeared with "ok: [x181vm226]" (the source
# host) while the import had not yet run at all. Matches every other Step
# 4-8 task in this file, which are all correctly guarded.
- name: "[mig_rman_l1f] ✓ CUTOVER COMPLETE [DESTINATION-ONLY]"
  when: inventory_hostname in groups['mig_destination']
  ansible.builtin.debug:
    msg: >
      mig_rman_l1f complete. Destination DB is OPEN and READ WRITE.
      Report: {{ validation_report_dir }}/migration_validation_report.txt
      Once verified and ready to go live, drop the guaranteed restore point:
      ansible-playbook m5_migration.yml --tags golive_drop_restore_point --ask-vault-pass
  run_once: true

# ════════════════════════════════════════════════════════════════════════════════
# OPTIONAL — GO LIVE: Drop guaranteed restore point (KA Section 5 step 9)
# Tagged 'never': meant to be skipped by every normal run (including
# --tags rman_l1f) and only execute when explicitly requested with its own
# tag. This is a deliberate, separate action taken once the migration is
# accepted — never bundled into the automatic cutover sequence above. See
# drop_restore_point.yml for details.
#
# The 'never' tag alone is NOT enough here: this role is included with
# tags: [rman_l1f] in m5_migration.yml, and that tag cascades onto every task
# inside the role — including this one. Since 'rman_l1f' becomes one of this
# task's own (inherited) tags, running the normal "--tags rman_l1f" cutover
# satisfies Ansible's "explicitly requested one of the task's tags" rule and
# silently defeats 'never' — confirmed live: this task ran (and failed, 0
# restore points found) during an ordinary cutover run that never passed
# --tags golive_drop_restore_point. The explicit ansible_run_tags check below
# closes that gap by checking what was ACTUALLY typed on the command line,
# not the inherited tag set.
# ════════════════════════════════════════════════════════════════════════════════
- name: "[mig_rman_l1f:golive] Drop guaranteed restore point (explicit opt-in only) [DESTINATION-ONLY, tag-gated — skipped on every normal run]"
  when:
    - inventory_hostname in groups['mig_destination']
    - "'golive_drop_restore_point' in (ansible_run_tags | default([]))"
  ansible.builtin.include_tasks: drop_restore_point.yml
  tags: [never, golive_drop_restore_point]
