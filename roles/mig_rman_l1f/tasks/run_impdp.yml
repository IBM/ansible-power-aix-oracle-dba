---
# roles/mig_rman_l1f/tasks/run_impdp.yml
# Execute impdp.sh on destination for Full Transportable DataPump import.
# Runs in the destination play — no delegate_to needed for destination tasks.
#
# Knowledge Article KB144840 (MOS Doc 2999157.1) Appendix Section 3:
#
# Step 5.1 — Edit impdp.sh before running:
#   ORACLE_HOME: Oracle home of destination database
#   ORACLE_SID:  SID of destination database (CDB root SID when dest is CDB)
#   ORACLE_PDB_SID: destination PDB SID (required when destination is a PDB)
#   ORACLE_CONNECT_STRING: connect string to destination non-CDB or PDB
#   DATA_PUMP_PARALLEL: DataPump parallel level
#   DATA_PUMP_TRACE: DataPump trace level
#   DATA_PUMP_DIR: repointed from the literal Oracle directory object name
#     "DATA_PUMP_DIR" to "M5DIR" — see the edit task below for why (ORA-65040
#     makes DATA_PUMP_DIR unredirectable inside a PDB).
#
# Step 5.2 — Invocation:
#   bash impdp.sh <exp.dmp> <log/restore_L0.log> <log/restore_L1.log> ... <log/restore_L1F.log> run N
#   NOTE 1: invoked via "bash", not "sh" as the KA's own example shows —
#   impdp.sh has "#!/bin/bash" and uses bash-only array syntax
#   (log_files=("${@:2:$log_file_count}")). AIX's /bin/sh is a genuine
#   POSIX/Korn shell, not bash: running it as "sh impdp.sh" throws
#   "0403-057 Syntax error ... `(' is not expected" on that line, but past
#   the initial arg-count check, so the script still exits 0 — it just never
#   populates log_files, so TRANSPORT_DATAFILES ends up empty and Data Pump
#   silently imports nothing. Confirmed live: a "successful" rc=0 run
#   produced 0 tables and no guaranteed restore point on the destination.
#   NOTE 2: the KA text/examples show a single "rman_last_restore_log", but the
#   ACTUAL DEPLOYED SCRIPT (read directly on the destination host, /u01/m5/impdp.sh)
#   is variadic and takes this as authoritative over the simplified KA example:
#     if [ $# -lt 4 ]; then
#       echo "Usage: $0 <expdp_dumpfile> <rman_restore_log1> [<rman_restore_log2> ...] [run|test|...] <encryption_pwd_prompt[Y|N]>"
#     ...
#     log_file_count=$(($#-3))
#     log_files=("${@:2:$log_file_count}")
#     export RUN_MODE="${@:$#-1:1}"
#     export DP_ENC_PROMPT="${@:$#:1}"
#     ...
#     paths=$( awk '/restoring foreign file/{...}' "${log_files[@]}" | sort -u )
#   It counts total args, treats everything between arg 1 (dumpfile) and the
#   last two (run-mode, enc-prompt) as an ARRAY of restore logs, and scans
#   ALL of them for "restoring foreign file ... to ..." lines, de-duplicating
#   with sort -u. So multiple space-separated restore log paths — one shell
#   word each, unquoted so the shell word-splits them into separate positional
#   args — is exactly the invocation the script is built for; passing only a
#   single log (a prior, now-reverted version of this task) works but throws
#   away the script's own designed-in ability to merge TRANSPORT_DATAFILES
#   across L0 + L1 + L1F in case they ever diverge (e.g. a tablespace added
#   between backup levels). The KA's "ensure you save all the necessary RMAN
#   restore logs that cover all the datafiles being migrated" line is this
#   same behavior in plain English, not just an archival instruction.
#
# Step 5.3 — Test mode first (generates par file without running DataPump):
#   bash impdp.sh <exp.dmp> <restore_logs> test N
#
# impdp_run_mode (mig_vars.yml): test | test-readonly | run | run-readonly
# dp_enc_prompt:                 Y | N
#
# all_restore_logs: accumulated fact set by run_restore.yml in mig_rman_l0_l1 and
# mig_rman_l1f — but only within a SINGLE ansible-playbook invocation
# (fact_caching isn't configured, so it never carries L0/L1's entries into a
# separate later L1F run, the common case). This role always scans the log
# directory for EVERY restore_L0_*.log / restore_L1_*.log / restore_L1F_*.log
# — not just the latest per level — and takes the union with whatever
# all_restore_logs holds, deduped, so the full set is included regardless of
# whether facts happened to accumulate in this run.

# ── Pre-edit impdp.sh (KA step 5.1) ──────────────────────────────────────────
# IMPORTANT: every line in the actual deployed impdp.sh is prefixed with
# "export " (e.g. "export ORACLE_SID=<MYSID>") — confirmed by reading the
# deployed file directly. The regexes below match and preserve that prefix;
# without it (a bare "^ORACLE_SID=..." anchor) ansible.builtin.replace finds
# no match anywhere in the file, silently makes zero changes, and reports
# changed: false without ever failing — every one of these substitutions was
# previously a no-op, leaving the literal placeholder text (<MYSID>,
# <MYCONNECTIONSTRING>, the default ORACLE_HOME, etc.) in place.
- name: "[mig_rman_l1f:import] Set ORACLE_HOME in impdp.sh"
  ansible.builtin.replace:
    path:    "{{ m5_workdir }}/impdp.sh"
    regexp:  '^export ORACLE_HOME=.*'
    replace: "export ORACLE_HOME={{ dest_oracle_home }}"

- name: "[mig_rman_l1f:import] Set ORACLE_SID in impdp.sh"
  ansible.builtin.replace:
    path:    "{{ m5_workdir }}/impdp.sh"
    regexp:  '^export ORACLE_SID=.*'
    # Non-CDB→Non-CDB: source_oracle_sid
    # Non-CDB→PDB / PDB→PDB: dest_cdb_sid (CDB root) — PDB itself is targeted
    # via ORACLE_CONNECT_STRING's service name, not a separate SID variable.
    replace: "export ORACLE_SID={{ dest_oracle_sid_effective }}"

# NOTE: no ORACLE_PDB_SID task here — confirmed by reading the deployed script
# that it has no such line at all, and ${ORACLE_PDB_SID} is never referenced
# anywhere else in the script either. PDB targeting is already fully handled
# by ORACLE_CONNECT_STRING resolving to the PDB's own service (see
# dest_connect_string_effective in playbooks/vars/m5_migration/mig_vars.yml) — a prior version of
# this task tried to replace a line that doesn't exist in this script version,
# which (like the bugs above) silently did nothing.

# IMPORTANT: no username/password here. impdp.sh builds its par file's userid
# line itself as: echo "userid='system@${ORACLE_CONNECT_STRING}'" — it already
# prepends "system@" unconditionally. Setting ORACLE_CONNECT_STRING to
# "SYSTEM/password@host:port/service" (a prior version of this task) produces
# a garbled, double-embedded userid='system@SYSTEM/password@host:port/service'
# — confirmed live: this failed with UDI-00002 (invalid username or password),
# then fell back to an interactive "Username:" prompt that hit EOF (UDI-00005)
# since there's no TTY. This is deliberate script/KA design, not a bug to work
# around: with no password in the connect string, Data Pump prompts for the
# password interactively (KA: "Data Pump prompts for the password of the user
# executing the import") — so instead of embedding it here, system_password is
# piped into bash impdp.sh's stdin in the real-run invocation below.
# impdp's own userid= parser cannot reliably handle an inline Easy Connect
# string that contains a service name ("host:port/service") — confirmed
# live: userid='system@129.40.76.118:1521/ecommpdb' fails immediately with
# ORA-12504 ("TNS:listener was not given the SERVICE_NAME in CONNECT_DATA"),
# even though the IDENTICAL string works fine via sqlplus (reaches the
# credential check, ORA-01017) and via RMAN elsewhere in this collection.
# This is a known Data Pump client limitation, not something specific to
# this environment or a bug in dest_connect_string_effective — impdp's
# arg parser splits on "/" before TNS resolution, and a second "/" inside
# the connect identifier confuses it. The standard, documented workaround is
# a TNS alias: userid='system@ALIAS' resolves correctly (confirmed live,
# same ORA-01017 result as sqlplus) because there's no "/" left to
# mis-parse. So a small managed tnsnames.ora entry is written here and
# ORACLE_CONNECT_STRING is pointed at the alias instead of the raw string.
- name: "[mig_rman_l1f:import] Ensure {{ dest_oracle_home }}/network/admin exists"
  ansible.builtin.file:
    path:  "{{ dest_oracle_home }}/network/admin"
    state: directory
    mode:  '0755'

- name: "[mig_rman_l1f:import] Write M5IMPDP TNS alias for impdp (managed block only — leaves existing tnsnames.ora entries untouched)"
  ansible.builtin.blockinfile:
    path:   "{{ dest_oracle_home }}/network/admin/tnsnames.ora"
    create: true
    mode:   '0640'
    marker: "# {mark} ANSIBLE MANAGED BLOCK — M5IMPDP alias (mig_rman_l1f/run_impdp.yml)"
    block: |
      M5IMPDP =
        (DESCRIPTION =
          (ADDRESS = (PROTOCOL = TCP)(HOST = {{ dest_host_effective }})(PORT = {{ listener_port }}))
          (CONNECT_DATA =
            (SERVER = DEDICATED)
            (SERVICE_NAME = {{ dest_pdb_name if dest_pdb_name | default('') | length > 0 else dest_oracle_sid }})
          )
        )

- name: "[mig_rman_l1f:import] Set ORACLE_CONNECT_STRING in impdp.sh"
  ansible.builtin.replace:
    path:    "{{ m5_workdir }}/impdp.sh"
    regexp:  '^export ORACLE_CONNECT_STRING=.*'
    replace: "export ORACLE_CONNECT_STRING=M5IMPDP"

- name: "[mig_rman_l1f:import] Set DATA_PUMP_PARALLEL in impdp.sh"
  ansible.builtin.replace:
    path:    "{{ m5_workdir }}/impdp.sh"
    regexp:  '^export DATA_PUMP_PARALLEL=.*'
    replace: "export DATA_PUMP_PARALLEL={{ dp_parallel }}"

- name: "[mig_rman_l1f:import] Set DATA_PUMP_TRACE in impdp.sh"
  ansible.builtin.replace:
    path:    "{{ m5_workdir }}/impdp.sh"
    regexp:  '^export DATA_PUMP_TRACE=.*'
    replace: "export DATA_PUMP_TRACE={{ dp_trace }}"

# impdp.sh ships with "export DATA_PUMP_DIR=DATA_PUMP_DIR" — that variable is
# later echoed as "directory=${DATA_PUMP_DIR}" into the generated par file, so
# by default the import reads from wherever the Oracle DATA_PUMP_DIR directory
# object resolves. In a PDB destination that object can't be redirected:
# Oracle raises ORA-65040 ("operation not allowed from within a pluggable
# database") on any attempt to CREATE OR REPLACE DIRECTORY DATA_PUMP_DIR from
# inside a PDB (confirmed live), and each PDB gets its own auto-provisioned
# DATA_PUMP_DIR pointing at a GUID-named subdirectory, independent of the CDB
# root's value — so capture_expdp_file.yml's SCP (to dest_dpdmp) and impdp's
# actual read location would silently diverge. M5DIR is an ordinary,
# non-reserved directory name with no such restriction, and
# db_prepare_source.yml / db_prepare_dest.yml already create it pointing at
# m5_dumpdir in every topology (source non-CDB, dest CDB root, dest PDB) —
# confirmed live in all three. Repointing impdp.sh at M5DIR instead keeps the
# dump file's actual location and impdp.sh's read location in permanent
# agreement, without chasing a per-PDB path at runtime.
- name: "[mig_rman_l1f:import] Point impdp.sh's DataPump directory at M5DIR (works in every topology, unlike DATA_PUMP_DIR in a PDB)"
  ansible.builtin.replace:
    path:    "{{ m5_workdir }}/impdp.sh"
    regexp:  '^export DATA_PUMP_DIR=.*'
    replace: "export DATA_PUMP_DIR=M5DIR"

# ── Make impdp.sh executable ──────────────────────────────────────────────────
- name: "[mig_rman_l1f:import] Make impdp.sh executable"
  ansible.builtin.file:
    path:  "{{ m5_workdir }}/impdp.sh"
    mode:  '0750'

# ── Build restore log argument list ───────────────────────────────────────────
# See the header comment above for why multiple space-separated logs is the
# correct, script-intended invocation (confirmed against the deployed
# impdp.sh's own arg-count-based parsing), not a single log as the KA's
# simplified example alone would suggest.
#
# Always scans the log directory for EVERY restore_L0_*.log / restore_L1_*.log
# / restore_L1F_*.log — not just the latest per level, and not gated behind
# "only if all_restore_logs is empty" as a prior version of this task did.
# That gating was itself a bug: run_restore.yml (mig_rman_l1f) unconditionally
# appends this run's OWN restore log to all_restore_logs, so all_restore_logs
# is NEVER actually empty by the time this task runs — meaning the file-system
# scan (which is what finds L0/L1's logs from earlier, separate
# ansible-playbook invocations) never executed in practice, and only
# all_restore_logs' single current-run entry got used. Fixed by always
# scanning, then taking the union of both sources (deduped) — L1 is
# intentionally repeatable (run daily until cutover), so several
# restore_L1_*.log files can exist; all of them are included, per explicit
# instruction, not just the latest. impdp.sh's own awk scan reads "restoring
# foreign file ... to ..." lines from every file in the array and
# de-duplicates with sort -u, so redundant entries are harmless.
- name: "[mig_rman_l1f:import] Find all L0 restore logs"
  ansible.builtin.find:
    paths:    "{{ m5_workdir }}/log"
    patterns: "restore_L0_*.log"
    file_type: file
  register: found_l0_logs

- name: "[mig_rman_l1f:import] Find all L1 restore logs"
  ansible.builtin.find:
    paths:    "{{ m5_workdir }}/log"
    patterns: "restore_L1_*.log"
    file_type: file
  register: found_l1_logs

- name: "[mig_rman_l1f:import] Find all L1F restore logs"
  ansible.builtin.find:
    paths:    "{{ m5_workdir }}/log"
    patterns: "restore_L1F_*.log"
    file_type: file
  register: found_l1f_logs

- name: "[mig_rman_l1f:import] Combine all restore logs (disk scan ∪ all_restore_logs fact)"
  ansible.builtin.set_fact:
    discovered_restore_logs: >-
      {{ ((found_l0_logs.files | default([]) | map(attribute='path') | list)
        + (found_l1_logs.files | default([]) | map(attribute='path') | list)
        + (found_l1f_logs.files | default([]) | map(attribute='path') | list)
        + (all_restore_logs | default([]))) | unique }}

- name: "[mig_rman_l1f:import] Assert at least one restore log was found"
  ansible.builtin.assert:
    that: discovered_restore_logs | default([]) | length > 0
    fail_msg: >
      No restore_L0_*.log / restore_L1_*.log / restore_L1F_*.log found under
      {{ m5_workdir }}/log — the restore phase must complete before import.

- name: "[mig_rman_l1f:import] Build restore log argument list"
  ansible.builtin.set_fact:
    restore_log_rel_list: >-
      {{ discovered_restore_logs
         | map('regex_replace', '^' + m5_workdir + '/', '')
         | sort
         | join(' ') }}

- name: "[mig_rman_l1f:import] Preview impdp.sh invocation"
  ansible.builtin.debug:
    msg: >-
      cd {{ m5_workdir }} &&
      bash impdp.sh {{ impdp_dumpfile }} {{ restore_log_rel_list }} {{ impdp_run_mode }} {{ dp_enc_prompt }}

# ── Step 5.3: test mode first ─────────────────────────────────────────────────
# impdp.sh has "#!/bin/bash" and uses bash-only array syntax
# (log_files=("${@:2:$log_file_count}")) — confirmed on the deployed AIX
# destination that invoking it via "sh impdp.sh" (as the KA's own example
# shows) fails with a real, silent-ish failure: AIX's /bin/sh is a genuine
# POSIX/Korn shell, not bash, so it throws
# "impdp.sh[30]: 0403-057 Syntax error at line 30 : `(' is not expected."
# on that line. Because that happens deep inside the script (past the initial
# argument count check), impdp.sh still exits 0 overall and reports success —
# but log_files never gets populated, so TRANSPORT_DATAFILES in the generated
# par file ends up empty and Data Pump silently imports nothing. Confirmed
# live: a "successful" (rc=0) run produced 0 tables and no guaranteed restore
# point on the destination. bash is present on AIX at /bin/bash — invoking
# via "bash impdp.sh" instead of "sh impdp.sh" runs the script with the
# interpreter its own shebang and syntax actually require.
- name: "[mig_rman_l1f:import] Run impdp.sh in test mode (generates par file)"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export PATH=${ORACLE_HOME}/bin:${PATH}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    {% if dest_pdb_name | default('') | length > 0 %}
    export ORACLE_PDB_SID={{ dest_pdb_name }}
    {% endif %}
    export NLS_DATE_FORMAT='DD-MON-YYYY HH24:MI:SS'
    cd {{ m5_workdir }}
    bash impdp.sh \
      {{ impdp_dumpfile }} \
      {{ restore_log_rel_list }} \
      test {{ dp_enc_prompt }} \
      2>&1 | tee {{ m5_workdir }}/log/impdp_test.out
    exit ${PIPESTATUS[0]}
  register: impdp_test_result
  when: impdp_run_mode in ['run', 'run-readonly']

- name: "[mig_rman_l1f:import] Show generated par file"
  ansible.builtin.shell: |
    find {{ m5_workdir }} -name 'imp_*_xtts.par' -newer {{ m5_workdir }}/log/impdp_test.out 2>/dev/null | head -1 | xargs cat
  register: impdp_par_content
  changed_when: false
  failed_when: false
  when: impdp_run_mode in ['run', 'run-readonly']

- name: "[mig_rman_l1f:import] Par file contents"
  ansible.builtin.debug:
    msg: "{{ impdp_par_content.stdout_lines | default(['(par file not found)']) }}"
  when: impdp_run_mode in ['run', 'run-readonly']

# ── Step 5.7: Execute impdp.sh in run mode ───────────────────────────────────
# impdp.sh's own par file has no password in its userid= line (see the
# ORACLE_CONNECT_STRING task above) — Data Pump prompts for it interactively,
# so it's piped into bash impdp.sh's stdin here, same pattern as
# run_backup.yml piping system_password into dbmig_driver_m5.sh. 3-stage
# pipe (echo | bash impdp.sh | tee), so PIPESTATUS[1] — not [0], which would
# be echo's always-0 exit code — is impdp.sh's real exit status.
- name: "[mig_rman_l1f:import] Execute impdp.sh — Full Transportable Import (timeout={{ impdp_timeout }}s)"
  ansible.builtin.shell: |
    export ORACLE_HOME={{ dest_oracle_home }}
    export PATH=${ORACLE_HOME}/bin:${PATH}
    export ORACLE_SID={{ dest_oracle_sid_effective }}
    {% if dest_pdb_name | default('') | length > 0 %}
    export ORACLE_PDB_SID={{ dest_pdb_name }}
    {% endif %}
    export NLS_DATE_FORMAT='DD-MON-YYYY HH24:MI:SS'
    cd {{ m5_workdir }}
    echo {{ system_password | quote }} | bash impdp.sh \
      {{ impdp_dumpfile }} \
      {{ restore_log_rel_list }} \
      {{ impdp_run_mode }} {{ dp_enc_prompt }} \
      2>&1 | tee {{ m5_workdir }}/log/impdp_run.out
    exit ${PIPESTATUS[1]}
  async:  "{{ impdp_timeout | int }}"
  poll:   "{{ impdp_poll | int }}"
  register: impdp_result
  no_log: true   # system_password is embedded in cmd — never let it reach Ansible's own output/failure dump

- name: "[mig_rman_l1f:import] Show last 40 lines of impdp output"
  ansible.builtin.command: "tail -40 {{ m5_workdir }}/log/impdp_run.out"
  register: impdp_tail
  changed_when: false
  failed_when: false

- name: "[mig_rman_l1f:import] impdp tail output"
  ansible.builtin.debug:
    msg: "{{ impdp_tail.stdout_lines | default([]) }}"

- name: "[mig_rman_l1f:import] Assert impdp.sh exited cleanly"
  ansible.builtin.assert:
    that: impdp_result.rc == 0
    fail_msg: >
      impdp.sh FAILED (rc={{ impdp_result.rc }}).
      Review: {{ m5_workdir }}/log/impdp_run.out
    success_msg: "impdp.sh completed successfully (rc=0)."
