---
# roles/mig_rman_l1f/tasks/get_restore_cmdfile.yml
# Locate the RMAN restore cmdfile generated by dbmig_driver_m5.sh
# and store it as a host fact for the restore task.
# Runs on source host.

- name: "[mig_rman_l1f:backup] Find restore cmdfile for {{ rman_level }}"
  ansible.builtin.find:
    paths:    "{{ m5_workdir }}/cmd"
    patterns: "restore_{{ rman_level }}_{{ source_oracle_sid }}_*.cmd"
  delegate_to: "{{ groups['mig_source'][0] }}"
  register: restore_cmdfiles

- name: "[mig_rman_l1f:backup] Assert restore cmdfile was generated"
  ansible.builtin.assert:
    that: restore_cmdfiles.files | length > 0
    fail_msg: >
      No restore cmdfile found!
      Expected: {{ m5_workdir }}/cmd/restore_{{ rman_level }}_{{ source_oracle_sid }}_*.cmd
      Check DBMIG logs.
    success_msg: "Restore cmdfile found ({{ restore_cmdfiles.files | length }} file(s))."

- name: "[mig_rman_l1f:backup] Set restore_cmdfile fact (latest by mtime)"
  ansible.builtin.set_fact:
    restore_cmdfile: >-
      {{ (restore_cmdfiles.files | sort(attribute='mtime', reverse=true) | first).path }}

- name: "[mig_rman_l1f:backup] Display restore cmdfile path"
  ansible.builtin.debug:
    msg: "Restore cmdfile for {{ rman_level }}: {{ restore_cmdfile }}"
