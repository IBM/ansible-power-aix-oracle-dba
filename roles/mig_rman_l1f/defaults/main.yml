---
# roles/mig_rman_l1f/defaults/main.yml

rman_level:       L1F
restore_cmdfile:  ""          # Populated by get_restore_cmdfile.yml
expdp_dumpfile:   ""          # Populated by capture_expdp_file.yml

# impdp_run_mode: test|test-readonly|run|run-readonly (KA Appendix Section 3).
# test(-readonly): generates the par file only — no import, no restore point.
# run: real import, creates guarantee restore point, tablespaces end READ WRITE.
# run-readonly: real import but keeps tablespaces READ ONLY (rehearsal — needs
# a later FLASHBACK + real "run" to finalize). Downtime starts at L1F backup
# regardless of this setting. NOTE: main.yml Steps 4-8 aren't gated on this —
# test mode will fail at the "set tablespaces READ WRITE" step since nothing
# was imported. Override from the command line (-e impdp_run_mode=test) or in
# playbooks/vars/m5_migration/mig_vars.yml if you need something other than a real run.
impdp_run_mode:   "run"
