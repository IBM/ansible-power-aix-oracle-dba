# Playbook to gather Oracle Database facts and inventory.
# Before executing this playbook, please refer to the documentation inside the collection docs directory.
#
- name: Gather DB Facts
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/vault.yml
    - vars/gather-dbfacts-vars.yml
  roles:
    - { role: oradb_gather_dbfacts }
