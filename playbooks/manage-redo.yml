# Playbook to manage database redo log groups and size.
# Before executing this playbook, please refer to the documentation inside the collection docs directory.
#
- name: Manage DB Redo Logs
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/vault.yml
    - vars/manage-redo-vars.yml
  roles:
    - { role: oradb_manage_redo }
