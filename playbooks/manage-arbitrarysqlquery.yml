# Playbook to execute adhoc SQL queries on a database.
# Before executing this playbook, please refer the documentation inside the docs/ directory.
#
- name: Run Arbitrary SQL Queries
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
   - vars/vault.yml
   - vars/manage-arbitrarysqlquery-vars.yml
  roles:
     - { role: oradb_manage_sqlqueries }
