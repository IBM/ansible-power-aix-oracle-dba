# Playbook to manage Oracle database directories (CREATE/DROP DIRECTORY).
# Before executing this playbook, please refer the documentation inside the docs/ directory.
#
- name: Manage DB Directories
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
   - vars/vault.yml
   - vars/manage-directories-vars.yml
  roles:
     - { role: oradb_manage_directories }
