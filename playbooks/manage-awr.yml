# Playbook to manage Automatic Workload Repository retention settings.
# Before executing this playbook, please refer the documentation inside the docs/ directory.
#
- name: Manage AWR Snapshot Settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
   - vars/vault.yml
   - vars/manage-awr-vars.yml
  roles:
     - { role: oradb_manage_awr }
