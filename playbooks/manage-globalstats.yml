# Playbook to manage DBMS_STATS global preferences for a database.
# Before executing this playbook, please refer the documentation inside the docs/ directory.
#
- name: Manage Global Statistics Preferences
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
   - vars/vault.yml
   - vars/manage-globalstats-vars.yml
  roles:
     - { role: oradb_manage_stats }
