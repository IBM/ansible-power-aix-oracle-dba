# Playbook to execute adhoc SQL scripts on a database.
# Before executing this playbook, please refer the documentation inside the docs/ directory.
#
- name: Run Arbitrary SQL Scripts
  hosts: localhost
  gather_facts: false
  vars_files:
   - vars/vault.yml
   - vars/manage-arbitrarysql-vars.yml
  roles:
     - { role: oradb_manage_sql }
