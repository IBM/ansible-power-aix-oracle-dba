# Playbook to upgrade Single Instance Database (both JFS & ASM). This is used when this playbooks is run from Ansible Automation Platform. 
- hosts: all
  remote_user: root
  gather_facts: true
  roles:
     - role: podba_si_has_upgrade
       tags: si_has_upgrade
  tasks:
    - name: Import oracle_install role
      ansible.builtin.import_role:
        name: ibm.power_aix_oracle.oracle_install_db
        tasks_from: oracle_install.yml
      tags: oracle_install
    - name: Run podba_db_upgrade role
      ansible.builtin.import_role:
        name: podba_db_upgrade
