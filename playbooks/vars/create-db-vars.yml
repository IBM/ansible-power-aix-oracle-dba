# Create Database - Variables section
oracle_user: oracle             # OS user that owns the Oracle installation.
oracle_group: oinstall          # Primary OS group for oracle_user.
oracle_stage: /tmp              # Path on the target AIX LPAR to stage response files.
oracle_base: /u01/app/oracle    # Oracle base directory.
oracle_dbf_dir_asm: '+DATA1'    # ASM diskgroup name for datafiles.

# ── Listener configuration ────────────────────────────────────────────────────
# Set create_listener: true ONLY for standalone SI environments without Grid Infrastructure.
# In GI/ASM/RAC environments the Grid listener is already running — leave this false.
create_listener: false          # true | false
listener_name: LISTENER         # Listener name (used when create_listener: true)
listener_port: 1521             # Listener port (used when create_listener: true)
listener_protocols: TCP         # Listener protocol (used when create_listener: true)

# oracle_databases: list of databases to create.
# Supported oracle_version_db values: 11.2.0.3 | 11.2.0.4 | 12.1.0.1 | 12.1.0.2 | 12.2.0.1 | 19c
# oracle_db_type values: SI (Single Instance) | RAC | RACONENODE
# storage_type values:   ASM (mandatory for RAC) | FS

oracle_databases:
- home: db1                                   # Last segment of ORACLE_HOME path (e.g. /u01/app/oracle/db1)
  oracle_version_db: 19c                      # Oracle version.
  oracle_home: /u01/db19c_2                   # Full Oracle Home path.
  oracle_db_name: testdb                      # Database name.
  oracle_db_type: SI                          # SI | RAC | RACONENODE
  is_container: true                          # true = CDB, false = non-CDB
  pdb_prefix: testpdb                         # PDB name prefix (used when is_container: true)
  num_pdbs: 1                                 # Number of PDBs to create.
  storage_type: ASM                           # ASM | FS
  redolog_size_in_mb: 50                      # Redo log size in MB.
  state: present                              # present | absent
  # oracle_init_params: comma-separated initialization parameters passed to dbca -initParams.
  # Tip: keep SGA sizing here; other params can be set post-creation via manage-init-parameters.yml
  oracle_init_params: "db_create_online_log_dest_1=+REDO,sga_max_size=10g,sga_target=10g"
