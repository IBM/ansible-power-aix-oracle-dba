# Manage Pluggable Databases - Variables section
hostname: ansible-db                  # AIX hostname where the database is running.
listener_port: 1521                   # Database listener port.
oracle_db_name: prod                  # CDB service name (the container database).
# oracle_db_home not needed - oracle_pdb module uses Thin mode (pure Python, no Oracle client required)

# ── Operation flags — set exactly one to true ─────────────────────────────────
create_pdb: false       # true = create a fresh PDB from seed
plug_pdb: false         # true = plug a PDB from an existing XML file
drop_pdb: true         # true = drop an existing PDB
unplug_pdb: false        # true = unplug a PDB to an XML file

# ── Storage ───────────────────────────────────────────────────────────────────
pdb_oradata_dest: /d01/19c/oradata              # ASM diskgroup (or FS path) to store PDB datafiles.
pdb_seed_dest: /d01/19c/oradata/PROD/pdbseed    # PDB Seed datafiles location. Use "select name from v$datafile where name like '%pdbseed%';"
xml_file_dest: /tmp                             # Directory path for XML manifest files (used with plug/unplug).

# ── PDB Create / Plug variables ───────────────────────────────────────────────
# Used when create_pdb: true or plug_pdb: true
create_oracle_pdbs:
- pdb_name: prodpdb1                                      # Name of the PDB to create or plug.
  cdb: "{{ oracle_db_name }}"                               # Parent CDB name.
  state: present                                            # present = create/plug the PDB.
  datafile_dest: "{{ pdb_oradata_dest }}"                   # Datafile destination.
  file_name_convert: "{{ pdb_seed_dest }},{{ pdb_oradata_dest }}"
  xml_dest: "{{ xml_file_dest }}"                           # Directory for the XML file.
  xml_file: prodpdb1.xml                                     # XML manifest filename (plug only).

# ── PDB Drop / Unplug variables ───────────────────────────────────────────────
# Used when drop_pdb: true or unplug_pdb: true
drop_oracle_pdbs:
- pdb_name: prodpdb1                                        # Name of the PDB to drop or unplug.
  cdb: "{{ oracle_db_name }}"                               # Parent CDB name.
  state: absent                                             # absent = drop | unplugged = unplug to XML
  datafile_dest: "{{ pdb_oradata_dest }}"
  xml_dest: "{{ xml_file_dest }}"                           # Directory for the XML file.
  xml_file: prodpdb1.xml                                    # XML manifest filename (unplug only).
